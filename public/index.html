<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>L'Arène — trois IA débattent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="arena.css">
</head>
<body>

<div class="bg-glow" id="bgGlow"></div>
<div class="bg-grid"></div>
<div class="bg-vignette"></div>

<!-- ------------------------------------------------ ECRAN DE LANCEMENT -->
<section class="setup" id="setup">
  <div class="setup-card">
    <p class="kicker">Trois intelligences. Trois angles. Un sujet.</p>
    <h1 class="logo">L'ARÈNE</h1>

    <div class="setup-personas" id="setupPersonas"></div>

    <label class="field">
      <span>Sujet du débat</span>
      <textarea id="topicInput" rows="2" placeholder="Quelle est la meilleure idée de business à lancer seul avec 5 000 € en 2026 ?"></textarea>
    </label>

    <label class="field">
      <span>Nombre de rounds <em id="roundsLabel">4</em> <small>— chaque IA parle une fois par round</small></span>
      <input type="range" id="roundsInput" min="1" max="8" value="4">
    </label>

    <button class="start" id="startBtn">Lancer le débat</button>
    <p class="setup-note" id="setupNote"></p>
  </div>
</section>

<!-- ---------------------------------------------------------- L'ARENE -->
<main class="arena" id="arena" hidden>

  <header class="topbar" data-chrome>
    <div class="topic" id="topicBar"></div>
    <div class="round-pill"><span id="roundNow">1</span><i>/</i><span id="roundTotal">4</span></div>
  </header>

  <section class="stage" id="stage"></section>

  <section class="caption" id="caption">
    <div class="caption-who" id="captionWho"></div>
    <p class="caption-text" id="captionText"></p>
  </section>

  <footer class="animatorbar" data-chrome>
    <div class="animator-tag">ANIMATEUR</div>
    <button id="micBtn" class="mic" title="Clique (ou barre Espace) pour parler, reclique pour envoyer">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3z"/>
        <path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>
      </svg>
      <span id="micLabel">Parler</span>
    </button>
    <input id="animatorInput" type="text" autocomplete="off"
           placeholder="Écris pour couper la parole  ·  Espace pour parler  ·  @krach pour viser un robot  ·  H masque l'interface">
    <button id="animatorSend">Couper</button>
    <button id="stopBtn" class="ghost">Arrêter</button>
  </footer>

  <div class="toast" id="toast" hidden></div>
</main>

<!-- ---------------------------------------------------------- VERDICT -->
<section class="verdict" id="verdict" hidden>
  <h2>Positions finales</h2>
  <p class="verdict-topic" id="verdictTopic"></p>
  <div class="verdict-cards" id="verdictCards"></div>
  <button class="start" id="replayBtn">Nouveau débat</button>
</section>

<audio id="player" preload="auto"></audio>
<script src="arena.js" type="module"></script>
</body>
</html>
